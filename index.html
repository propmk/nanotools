<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanotools: A collection of useful tools</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
<section id="toolboard" class="toolboard-hero">
    <div class="section-head">
      <div class="eyebrow">toolboard</div>
      <h2>Pick a tool.</h2>
    </div>
    <div class="plate-grid">
      <button class="plate" type="button" data-tool="T01">
        <span class="code">T01</span>
        <span class="name">Image Resizer</span>
        <span class="desc">Scale an image to exact dimensions or by percentage.</span>
      </button>
      <button class="plate" type="button" data-tool="T02">
        <span class="code">T02</span>
        <span class="name">Format Converter</span>
        <span class="desc">Convert between PNG, JPEG and WebP.</span>
      </button>
      <button class="plate" type="button" data-tool="T03">
        <span class="code">T03</span>
        <span class="name">JSON Formatter</span>
        <span class="desc">Validate, pretty-print, or minify JSON.</span>
      </button>
      <button class="plate" type="button" data-tool="T04">
        <span class="code">T04</span>
        <span class="name">Hash Generator</span>
        <span class="desc">SHA-1 / SHA-256 / SHA-384 / SHA-512 for files or text.</span>
      </button>
      <button class="plate" type="button" data-tool="T05">
        <span class="code">T05</span>
        <span class="name">CSV ⇄ JSON</span>
        <span class="desc">Convert tabular CSV to JSON and back.</span>
      </button>
      <button class="plate" type="button" data-tool="T06">
        <span class="code">T06</span>
        <span class="name">Text Inspector</span>
        <span class="desc">Word/char counts and case conversion.</span>
      </button>
    </div>
  </section>

    
</body>
</html>
