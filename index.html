<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanotools: A collection of useful tools</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
<section id="toolboard" class="toolboard-hero">
    <div class="section-head">
      <div class="eyebrow">toolboard</div>
      <h2>Pick a tool.</h2>
    </div>
    <div class="plate-grid">
      <button class="plate" type="button" data-tool="T01">
        <span class="code">T01</span>
        <span class="name">Image Resizer</span>
        <span class="desc">Scale an image to exact dimensions or by percentage.</span>
      </button>
      <button class="plate" type="button" data-tool="T02">
        <span class="code">T02</span>
        <span class="name">Format Converter</span>
        <span class="desc">Convert between PNG, JPEG and WebP.</span>
      </button>
    </div>
  </section>

    
</body>
</html>
